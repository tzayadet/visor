name: Static application checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/**"
      - ".github/workflows/quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate viewer
        run: python scripts/validate_site.py
